<!doctype html>
<html lang="th" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0608" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f1f3" media="(prefers-color-scheme: light)" />
    <meta name="description" content="FORM — Personal IF & Wellness Tracker. ข้อมูลเก็บไว้ในเครื่องของคุณเท่านั้น" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FORM" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>FORM — IF & Wellness</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('form-theme') || '"dark"');
        var dark = s === 'dark' || (s === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.accent = localStorage.getItem('form-accent') || 'burgundy';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>FORM ต้องเปิดใช้ JavaScript</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
